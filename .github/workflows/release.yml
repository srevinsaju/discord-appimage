name: Release

on:
  schedule:
    - cron: "5 */12 * * *"
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - channel: stable
            artifact: discord-continuous-x86_64.AppImage
          - channel: ptb
            artifact: discord-ptb-continuous-x86_64.AppImage
          - channel: canary
            artifact: discord-canary-continuous-x86_64.AppImage

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl file jq libfuse2 tar

      - name: Build ${{ matrix.channel }} AppImage
        run: ./build.sh "${{ matrix.channel }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  Release:
    needs: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - artifact: discord-continuous-x86_64.AppImage
            release_tag: stable
            title: Discord Stable AppImage Builds
            prerelease: false
          - artifact: discord-ptb-continuous-x86_64.AppImage
            release_tag: ptb
            title: Discord Public Test AppImage Builds
            prerelease: true
          - artifact: discord-canary-continuous-x86_64.AppImage
            release_tag: canary
            title: Discord Canary AppImage Builds
            prerelease: true

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts

      - uses: marvinpinto/action-automatic-releases@latest
        with:
          title: ${{ matrix.title }}
          automatic_release_tag: ${{ matrix.release_tag }}
          prerelease: ${{ matrix.prerelease }}
          draft: false
          files: artifacts/*
          repo_token: ${{ secrets.GITHUB_TOKEN }}
